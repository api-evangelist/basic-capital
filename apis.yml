aid: basic-capital
name: Basic Capital
description: 'Basic Capital is a modern 401(k) platform that reimagines workplace retirement
  saving. It is the first and only 401(k) provider that lets participants finance assets
  inside their plan, offering $4 of financing for every $1 contributed for up to 5x
  investing power, alongside access to alternative and private-market investments. The
  platform pairs a mobile-first participant experience with 6,000+ investment options,
  a built-in brokerage window, support for mega backdoor Roth contributions, and its
  "Retirement Mortgage" long-term financing product. Basic Capital serves employers,
  employees, and financial advisors, with an IRA offering for individuals. Founded to
  modernize a retirement system largely unchanged for 40 years, the company is headquartered
  in New York City and closed a $25M Series A in 2025 led by Forerunner and Lux Capital,
  with participation from SV Angel, BoxGroup, and Henry Kravis. This API Evangelist
  profile tracks the company; Basic Capital does not publish a public developer API.'
